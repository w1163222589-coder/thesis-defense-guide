interface:
  display_name: "Thesis Defense Guide"
  short_description: "Simulate your thesis defense and predict committee questions — for any discipline."
  default_prompt: "Build a committee-by-committee thesis defense manual for my discipline. Require my thesis/defense materials, the committee list, and the school/program context first. Detect my research paradigm and judge by that field's standards. Run an evaluator-blind weakness audit (severity-ranked Weakness Ledger), reverse-engineer the Top-10 most dangerous questions, coach bounded answers that don't overclaim (10/30/60-second layers, concede-and-redirect for fatal points), research the committee with evidence grades, offer an interactive mock defense that keeps attack intensity, score my readiness 0–100 (with anchor caps), and ship risk-first output led by a day-of one-pager plus a concept drill of thesis-term fundamentals. If I provide official reviewer reports (盲审/评阅意见) or a revision-response sheet, seed the weakness audit from them first."
