<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wt wd" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
<title id="wt">答辩备战流水线</title>
<desc id="wd">从 Stage 0 范式判定 到 Stage 7 就绪度与输出 的八阶段流水线。Stage 1 弱点审计是基石,在任何答案之前就固化。</desc>
<rect width="1200" height="300" rx="10" fill="#13284b"/>
<rect x="16" y="16" width="1168" height="268" rx="7" fill="none" stroke="#c8a85a" stroke-opacity="0.35" stroke-width="1.3"/>
<text x="600" y="46" text-anchor="middle" font-size="15" letter-spacing="4" fill="#c8a85a">弱点优先 · 学科自适应</text>
<line x1="80" y1="150" x2="1120" y2="150" stroke="#c8a85a" stroke-width="2" stroke-opacity="0.55"/>
<text x="229" y="104" text-anchor="middle" font-size="15" fill="#c8a85a">★</text>
<text x="229" y="121" text-anchor="middle" font-size="12" letter-spacing="2" fill="#c8a85a">基石</text>
<circle cx="80" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/><text x="80" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">0</text><text x="80" y="190" text-anchor="middle" font-size="14" fill="#f4efe6">范式</text><text x="80" y="210" text-anchor="middle" font-size="14" fill="#f4efe6">判定</text>
<circle cx="229" cy="150" r="22" fill="#c8a85a" stroke="#f4efe6" stroke-width="1.5"/><text x="229" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#13284b">1</text><text x="229" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#f4efe6">弱点</text><text x="229" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#f4efe6">审计</text>
<circle cx="377" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/><text x="377" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">2</text><text x="377" y="190" text-anchor="middle" font-size="14" fill="#f4efe6">评委</text><text x="377" y="210" text-anchor="middle" font-size="14" fill="#f4efe6">检索</text>
<circle cx="526" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/><text x="526" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">3</text><text x="526" y="190" text-anchor="middle" font-size="14" fill="#f4efe6">威胁</text><text x="526" y="210" text-anchor="middle" font-size="14" fill="#f4efe6">映射</text>
<circle cx="674" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/><text x="674" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">4</text><text x="674" y="190" text-anchor="middle" font-size="14" fill="#f4efe6">出题</text><text x="674" y="210" text-anchor="middle" font-size="13" fill="#f4efe6">Top-10</text>
<circle cx="823" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/><text x="823" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">5</text><text x="823" y="190" text-anchor="middle" font-size="14" fill="#f4efe6">答案</text><text x="823" y="210" text-anchor="middle" font-size="14" fill="#f4efe6">教练</text>
<circle cx="971" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/><text x="971" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">6</text><text x="971" y="190" text-anchor="middle" font-size="14" fill="#f4efe6">模拟</text><text x="971" y="210" text-anchor="middle" font-size="14" fill="#f4efe6">答辩</text>
<circle cx="1120" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/><text x="1120" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">7</text><text x="1120" y="190" text-anchor="middle" font-size="14" fill="#f4efe6">就绪</text><text x="1120" y="210" text-anchor="middle" font-size="14" fill="#f4efe6">输出</text>
<text x="600" y="263" text-anchor="middle" font-size="14.5" fill="#f4efe6" fill-opacity="0.78">Stage 1 在任何答案之前就固化 —— 出题者与答题者是两遍。</text>
</svg>
