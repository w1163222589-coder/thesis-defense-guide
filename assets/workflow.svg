<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wt wd" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
<title id="wt">Thesis Defense Guide pipeline</title>
<desc id="wd">An eight-stage pipeline from Stage 0 paradigm detection to Stage 7 readiness and output. Stage 1, the weakness audit, is the keystone and is committed before any answer is written.</desc>
<rect width="1200" height="300" rx="10" fill="#13284b"/>
<rect x="16" y="16" width="1168" height="268" rx="7" fill="none" stroke="#c8a85a" stroke-opacity="0.35" stroke-width="1.3"/>
<text x="600" y="46" text-anchor="middle" font-size="14" letter-spacing="3.5" fill="#c8a85a">WEAKNESS-FIRST · PARADIGM-ADAPTIVE</text>

<!-- flow line -->
<line x1="80" y1="150" x2="1120" y2="150" stroke="#c8a85a" stroke-width="2" stroke-opacity="0.55"/>

<!-- keystone marker for Stage 1 -->
<text x="229" y="104" text-anchor="middle" font-size="15" fill="#c8a85a">★</text>
<text x="229" y="120" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#c8a85a">KEYSTONE</text>

<!-- stations -->
<g>
<circle cx="80" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/>
<text x="80" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">0</text>
<text x="80" y="190" text-anchor="middle" font-size="13" fill="#f4efe6">Paradigm</text>
<text x="80" y="207" text-anchor="middle" font-size="13" fill="#f4efe6">detect</text>
</g>
<g>
<circle cx="229" cy="150" r="22" fill="#c8a85a" stroke="#f4efe6" stroke-width="1.5"/>
<text x="229" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#13284b">1</text>
<text x="229" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#f4efe6">Weakness</text>
<text x="229" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#f4efe6">audit</text>
</g>
<g>
<circle cx="377" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/>
<text x="377" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">2</text>
<text x="377" y="190" text-anchor="middle" font-size="13" fill="#f4efe6">Evaluator</text>
<text x="377" y="207" text-anchor="middle" font-size="13" fill="#f4efe6">research</text>
</g>
<g>
<circle cx="526" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/>
<text x="526" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">3</text>
<text x="526" y="190" text-anchor="middle" font-size="13" fill="#f4efe6">Threat</text>
<text x="526" y="207" text-anchor="middle" font-size="13" fill="#f4efe6">map</text>
</g>
<g>
<circle cx="674" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/>
<text x="674" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">4</text>
<text x="674" y="190" text-anchor="middle" font-size="13" fill="#f4efe6">Questions</text>
<text x="674" y="207" text-anchor="middle" font-size="13" fill="#f4efe6">(Top-10)</text>
</g>
<g>
<circle cx="823" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/>
<text x="823" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">5</text>
<text x="823" y="190" text-anchor="middle" font-size="13" fill="#f4efe6">Answer</text>
<text x="823" y="207" text-anchor="middle" font-size="13" fill="#f4efe6">coaching</text>
</g>
<g>
<circle cx="971" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/>
<text x="971" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">6</text>
<text x="971" y="190" text-anchor="middle" font-size="13" fill="#f4efe6">Mock</text>
<text x="971" y="207" text-anchor="middle" font-size="13" fill="#f4efe6">defense</text>
</g>
<g>
<circle cx="1120" cy="150" r="17" fill="#13284b" stroke="#c8a85a" stroke-width="2"/>
<text x="1120" y="156" text-anchor="middle" font-size="17" font-weight="600" fill="#f4efe6">7</text>
<text x="1120" y="190" text-anchor="middle" font-size="13" fill="#f4efe6">Readiness</text>
<text x="1120" y="207" text-anchor="middle" font-size="13" fill="#f4efe6">&amp; output</text>
</g>

<text x="600" y="262" text-anchor="middle" font-size="14.5" font-style="italic" font-family="Georgia, 'Times New Roman', serif" fill="#f4efe6" fill-opacity="0.78">Stage 1 is committed before any answer — the attacker and the answerer are different passes.</text>
</svg>
